[project]
name = "cnn"
version = "3.1.0"
description = "CNN"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "einops>=0.8.0",
    "torch>=2.0.0",
    "torchgeometry>=0.1.2",
    "vector-quantize-pytorch>=1.14.8",
]

[project.optional-dependencies]
train = [
    "gdown>=5.2.0",
    "jsonargparse[signatures]>=4.32.1",
    "lightning>=2.3.3",
    "torchvision>=0.19.1",
    "wandb>=0.18.0",
]
dev = [
    "mypy>=1.11.2",
    "poethepoet>=0.28.0",
    "pydoclint>=0.5.7",
    "ruff>=0.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["CPY001"]
fixable = ["ALL"]
unfixable = []
exclude = [".git", ".ruff_cache", ".venv",]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["cnn"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pydoclint]
style = 'numpy'
exclude = '\.git|\.ruff_cache|\.mypy_cache|\.venv'

[tool.poe.tasks]
lint-ruff = "ruff check --fix ."
lint-mypy = "mypy --strict ."
lint-pydoclint = "pydoclint ."
lint = ["lint-ruff", "lint-pydoclint", "lint-mypy",]
